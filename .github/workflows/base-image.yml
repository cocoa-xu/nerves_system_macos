name: Build macOS base
run-name: macOS base images (${{ inputs.macos || github.ref_name }})

on:
  push:
    branches: [main]
    tags: ['*-v*']
    paths: [ci/publication.json]
  workflow_dispatch:
    inputs:
      macos:
        description: macOS version to build
        type: choice
        options: [all, '15', '26', '27']
        default: all
      publish:
        description: Publish verified bases to GHCR and GitHub Releases
        type: boolean
        default: true
      verified_run:
        description: Resume publication of a saved CI run (run ID-attempt); leave empty to build
        type: string
        default: ''
      release_run:
        description: Create a GitHub release from a published and verified CI run (run ID-attempt)
        type: string
        default: ''

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: macos-base
  cancel-in-progress: false

jobs:
  authorize:
    if: >-
      github.repository == 'cocoa-xu/nerves_system_macos' &&
      github.actor == 'cocoa-xu' && github.triggering_actor == 'cocoa-xu' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'push' &&
        (github.ref_type == 'tag' || github.ref == 'refs/heads/main')))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      versions: ${{ steps.versions.outputs.versions }}
      verified_run: ${{ steps.versions.outputs.verified_run }}
      release_run: ${{ steps.versions.outputs.release_run }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require a commit from main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Select macOS versions
        id: versions
        env:
          MACOS: ${{ inputs.macos }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          BEFORE: ${{ github.event.before }}
          VERIFIED_RUN: ${{ inputs.verified_run }}
          RELEASE_RUN: ${{ inputs.release_run }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          versions = ["15", "26", "27"]
          macos = os.environ["MACOS"]
          verified_run = os.environ["VERIFIED_RUN"]
          release_run = os.environ["RELEASE_RUN"]
          event = os.environ["EVENT"]
          if event == "push" and os.environ["REF_TYPE"] == "branch":
              before = os.environ["BEFORE"]
              if os.environ["REF"] != "main" or not re.fullmatch(r"[0-9a-f]{40}", before):
                  raise SystemExit("Publication requests must be pushed to main")
              changed = subprocess.run(
                  ["git", "diff", "--name-only", "-z", before, "HEAD"],
                  check=True,
                  capture_output=True,
                  timeout=30,
              )
              if changed.stdout != b"ci/publication.json\0":
                  raise SystemExit("Publication requests must be pushed without other file changes")
              path = Path("ci/publication.json")
              if path.is_symlink() or not path.is_file():
                  raise SystemExit("ci/publication.json must be a regular file")
              request = json.loads(path.read_text())
              if not isinstance(request, dict) or set(request) not in (
                  {"macos", "verified_run"}, {"macos", "release_run"}
              ):
                  raise SystemExit("Publication requests require macos and one recovery run")
              macos = request["macos"]
              verified_run = request.get("verified_run", "")
              release_run = request.get("release_run", "")
              if not isinstance(verified_run, str) or not isinstance(release_run, str) or not (verified_run or release_run):
                  raise SystemExit("Publication requests require a run ID-attempt")
          elif event == "push" and os.environ["REF_TYPE"] == "tag":
              matches = []
              for major in versions:
                  profile = json.loads(Path(f"ci/macos{major}.json").read_text())
                  tag = f'{profile["macos"]["version"]}-{profile["macos"]["build"]}-v{profile["image_version"]}'
                  if tag == os.environ["REF"]:
                      matches.append(major)
              if len(matches) != 1:
                  raise SystemExit("The release tag must match exactly one pinned profile")
              macos = matches[0]
              verified_run = ""
              release_run = ""
          elif event != "workflow_dispatch":
              raise SystemExit("Unsupported workflow event")
          if verified_run and release_run:
              raise SystemExit("Select only one recovery run")
          if verified_run or release_run:
              if (macos not in versions or
                  (event == "workflow_dispatch" and os.environ["PUBLISH"] != "true") or
                  not re.fullmatch(r"[1-9]\d*-[1-9]\d*", verified_run or release_run)):
                  raise SystemExit("Select one macOS version, enable publication and enter a saved run ID-attempt")
          if macos != "all":
              if macos not in versions:
                  raise SystemExit("Select macOS 15, 26 or 27")
              versions = [macos]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("versions=" + json.dumps(versions) + "\n")
              output.write("verified_run=" + verified_run + "\n")
              output.write("release_run=" + release_run + "\n")
          PY

  build:
    name: macOS ${{ matrix.macos }}
    needs: authorize
    if: needs.authorize.outputs.release_run == ''
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 210
    permissions:
      contents: read
      packages: write
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        macos: ${{ fromJSON(needs.authorize.outputs.versions) }}
    env:
      MACOS_MAJOR: ${{ matrix.macos }}
      VERIFIED_RUN: ${{ needs.authorize.outputs.verified_run }}
      PATH: /opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin
      HEX_CACERTS_PATH: /opt/homebrew/etc/openssl@3/cert.pem
      NERVES_MACOS_CACERT: /opt/homebrew/etc/openssl@3/cert.pem
      GIT_SSL_CAINFO: /opt/homebrew/etc/openssl@3/cert.pem
      GIT_CONFIG_NOSYSTEM: '1'
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: credential.helper
      GIT_CONFIG_VALUE_0: ''
      GIT_TERMINAL_PROMPT: '0'
      GOPROXY: 'off'
      GOSUMDB: 'off'
      TART_NO_AUTO_PRUNE: '1'
      PACKER_LOG: '1'
      PACKER_LOG_PATH: ${{ github.workspace }}/.nerves/ci-logs/packer.log
      GUEST_USERNAME: admin
      GUEST_PASSWORD: admin
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 3
        with:
          persist-credentials: false
          set-safe-directory: false
      - uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6
        if: github.event_name == 'push' || inputs.publish
        timeout-minutes: 3
        with:
          version: 1.3.0
      - name: Check the platform
        timeout-minutes: 5
        run: |
          mkdir -p .nerves/ci-logs
          mix deps.get --check-locked
          make validate
          mix run ci/base-image.exs check
      - name: Check publication access
        if: github.event_name == 'push' || inputs.publish
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: mix run ci/base-image.exs check-publication
      - name: Build and verify macOS
        if: needs.authorize.outputs.verified_run == ''
        timeout-minutes: 100
        run: mix run ci/base-image.exs 2>&1 | tee .nerves/ci-logs/build.log
      - name: Restore the verified CI base
        if: needs.authorize.outputs.verified_run != ''
        timeout-minutes: 10
        run: mix run ci/base-image.exs restore 2>&1 | tee .nerves/ci-logs/restore.log
      - name: Export the verified base
        id: export
        if: github.event_name == 'push' || inputs.publish
        timeout-minutes: 35
        run: mix run ci/base-image.exs export 2>&1 | tee .nerves/ci-logs/export.log
      - name: Push the base to GHCR
        if: github.event_name == 'push' || inputs.publish
        timeout-minutes: 45
        env:
          GH_TOKEN: ${{ github.token }}
          LAYOUT: ${{ steps.export.outputs.layout }}
          REFERENCE: ${{ steps.export.outputs.reference }}
        run: |
          mix run ci/base-image.exs check-publication
          bash ci/push.sh 2>&1 | tee .nerves/ci-logs/push.log
      - name: Verify the published base
        if: github.event_name == 'push' || inputs.publish
        timeout-minutes: 60
        run: mix run ci/base-image.exs verify-publication 2>&1 | tee .nerves/ci-logs/publish.log
      - name: Clean this run's images
        if: always()
        timeout-minutes: 5
        run: mix run ci/base-image.exs cleanup
      - name: Save build results
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos${{ matrix.macos }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .nerves/ci-logs/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Release macOS ${{ matrix.macos }}
    needs: [authorize, build]
    if: >-
      always() && needs.authorize.result == 'success' &&
      (needs.build.result == 'success' || needs.authorize.outputs.release_run != '') &&
      (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        macos: ${{ fromJSON(needs.authorize.outputs.versions) }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: cocoa-xu/nerves_system_macos
      GH_CONFIG_DIR: ${{ github.workspace }}/.nerves/gh-release
      GH_PROMPT_DISABLED: '1'
      NERVES_MACOS_CACERT: /etc/ssl/certs/ca-certificates.crt
      PUBLICATION_RUN: ${{ needs.authorize.outputs.release_run || format('{0}-{1}', github.run_id, github.run_attempt) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6
        with:
          version: 1.3.0
      - name: Download publication results
        env:
          MACOS_MAJOR: ${{ matrix.macos }}
        run: |
          run_id="${PUBLICATION_RUN%-*}"
          attempt="${PUBLICATION_RUN#*-}"
          gh api "repos/$GH_REPO/actions/runs/$run_id/attempts/$attempt" > "$RUNNER_TEMP/publication-run.json"
          jq -e --arg repository "$GH_REPO" --argjson attempt "$attempt" \
            --arg current "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --arg publication "$PUBLICATION_RUN" '
            .repository.full_name == $repository and .run_attempt == $attempt and
            .actor.login == "cocoa-xu" and .triggering_actor.login == "cocoa-xu" and
            .path == ".github/workflows/base-image.yml" and
            (.event == "push" or .event == "workflow_dispatch") and
            (.status == "completed" or $publication == $current)
          ' "$RUNNER_TEMP/publication-run.json"
          git merge-base --is-ancestor "$(jq -er .head_sha "$RUNNER_TEMP/publication-run.json")" origin/main
          gh api "repos/$GH_REPO/actions/runs/$run_id/attempts/$attempt/jobs?per_page=100" > "$RUNNER_TEMP/publication-jobs.json"
          jq -e --arg major "$MACOS_MAJOR" --slurpfile run "$RUNNER_TEMP/publication-run.json" '
            any(.jobs[]; .name == ("macOS " + $major) and
              .status == "completed" and .head_sha == $run[0].head_sha and
              any(.steps[]; (.name == "Build and verify macOS" or .name == "Restore the verified CI base") and .conclusion == "success") and
              any(.steps[]; (.name == "Publish and verify the base" or .name == "Verify the published base") and (.conclusion == "success" or .conclusion == "failure")) and
              any(.steps[]; .name == "Save build results" and .conclusion == "success"))
          ' "$RUNNER_TEMP/publication-jobs.json"
          gh run download "$run_id" --name "macos$MACOS_MAJOR-$PUBLICATION_RUN" --dir .nerves/ci-logs
      - name: Create GitHub release
        env:
          MACOS_MAJOR: ${{ matrix.macos }}
        run: bash ci/release.sh
